// ---- Marcadores (medidas M1-M4 y tipo) ----
var MRE=/^\s*\d+(?:[.,]\d+)?(?:\s*(?:\([A-Za-z]\)|-)\s*\d+(?:[.,]\d+)?){1,3}\s*$/;
function parseMarc(txt){
  var s0=String(txt==null?"":txt).trim();
  if(!s0)return null;
  var nums=s0.match(/\d+(?:[.,]\d+)?/g)||[],lets=(s0.match(/\(([A-Za-z])\)/g)||[]).map(function(z){return z.charAt(1).toUpperCase()});
  var m=["N/A","N/A","N/A","N/A"],flag="";
  for(var i=0;i<4;i++)if(nums[i]!==undefined)m[i]=nums[i].replace(",",".");
  if(nums.length>4)flag="m\u00e1s de 4 cifras";
  if(lets.some(function(z){return z!==lets[0]}))flag=(flag?flag+"; ":"")+"letras distintas";
  return {m:m,t:lets.length?lets[0]:"N/A",x:s0,flag:flag};
}
/* ---- detecci\u00f3n de la columna de marcadores por CONTENIDO (no por el encabezado) ---- */
var NA4=["N/A","N/A","N/A","N/A"];
function mkNorm(s){return String(s).replace(/[\u00a0\u2007\u202f]/g," ").replace(/[\u2013\u2014\u2212]/g,"-").replace(/\uff08/g,"(").replace(/\uff09/g,")").replace(/\s+/g," ").trim()}
function mkLoose(s){return (s.match(/\d+(?:[.,]\d+)?/g)||[]).length>=2&&(/\([A-Za-z]\)/.test(s)||/\d\s*-\s*\d/.test(s))}
function mkPed(row){
  for(var j=0;j<row.length;j++){var c=row[j];if(typeof c!=="string")continue;var m=/PT[-\s]?(\d{5})\s?(\d{2})/i.exec(c);if(m)return "PT-"+m[1]+" "+m[2]}
  return null;
}
function mkLetra(j){var s="";j++;while(j>0){var r=(j-1)%26;s=String.fromCharCode(65+r)+s;j=Math.floor((j-1)/26)}return s}
function mkColHdr(arr){
  var cnt={},best=null;
  arr.forEach(function(row){if(row)row.forEach(function(c,j){if(typeof c==="string"&&c.trim().toLowerCase()==="marcadores")cnt[j]=(cnt[j]||0)+1})});
  Object.keys(cnt).forEach(function(j){if(best===null||cnt[j]>cnt[best])best=+j});
  return best;
}
function mkRellenar(r){
  var s=(r.x||"").trim();
  if(!s){r.m=NA4.slice();r.t="N/A";r.est="sin";r.nota="";return}
  s=mkNorm(s);
  if(!MRE.test(s)){r.m=NA4.slice();r.t="N/A";r.est="rv";r.nota="Formato no reconocido";return}
  var q=parseMarc(s);r.m=q.m;r.t=q.t;r.est=q.flag?"rv":"ok";r.nota=q.flag||"";
}
/* forz = indice de columna elegido a mano (o null para autom\u00e1tico) */
function leerMarc(arr,forz){
  var pr=[],cnt={},ej={};
  arr.forEach(function(row){
    if(!row)return;var ped=mkPed(row);if(!ped)return;
    pr.push({row:row,ped:ped});
    row.forEach(function(c,j){if(typeof c!=="string")return;var s=mkNorm(c);if(MRE.test(s)){cnt[j]=(cnt[j]||0)+1;if(!ej[j])ej[j]=s}});
  });
  var hdr=mkColHdr(arr);
  var cols=Object.keys(cnt).map(function(j){return {j:+j,n:cnt[j],ej:ej[j]||""}});
  [hdr,forz].forEach(function(j){if(j!==null&&j!==undefined&&!cols.some(function(c){return c.j===j}))cols.push({j:j,n:0,ej:""})});
  cols.sort(function(a,b){return b.n-a.n||(hdr===null?0:Math.abs(a.j-hdr)-Math.abs(b.j-hdr))||a.j-b.j});
  var used;
  if(forz!==null&&forz!==undefined)used=[forz];
  else if(cols.length&&cols[0].n>0){var mx=cols[0].n,lim=Math.max(2,Math.ceil(mx*0.2));used=cols.filter(function(c){return c.n>=lim}).map(function(c){return c.j});if(!used.length)used=[cols[0].j]}
  else used=hdr!==null?[hdr]:[];
  var forzado=forz!==null&&forz!==undefined,map={},orden=[];
  pr.forEach(function(o){
    var x=null,bad=null,nota="";
    for(var k=0;k<used.length&&x===null;k++){
      var c=o.row[used[k]];
      if(typeof c==="string"){var s=mkNorm(c);if(MRE.test(s))x=s;else if(s&&(forzado||mkLoose(s))&&bad===null)bad=s}
      else if(forzado&&c!=null&&String(c).trim()!==""&&bad===null)bad=String(c).trim();
    }
    if(x===null&&!forzado){  /* con la forma exacta de un marcador, pero fuera de las columnas habituales */
      o.row.forEach(function(c,j){if(x===null&&used.indexOf(j)<0&&typeof c==="string"){var s=mkNorm(c);if(MRE.test(s)){x=s;nota="Tomado de la columna "+mkLetra(j)}}});
    }
    var e=map[o.ped];if(!e){e=map[o.ped]={veces:0,xs:[],bad:[],nota:""};orden.push(o.ped)}
    e.veces++;
    if(x!==null&&e.xs.indexOf(x)<0)e.xs.push(x);
    if(bad!==null&&x===null&&e.bad.indexOf(bad)<0)e.bad.push(bad);
    if(nota)e.nota=nota;
  });
  var rows=orden.map(function(p){
    var e=map[p],r={p:p,veces:e.veces,x:"",m:NA4.slice(),t:"N/A",est:"sin",nota:"",edit:false,prog:null};
    if(e.xs.length){
      r.x=e.xs[0];mkRellenar(r);
      if(e.nota)r.nota=(r.nota?r.nota+"; ":"")+e.nota;
      if(e.xs.length>1){r.est="rv";r.nota=(r.nota?r.nota+"; ":"")+"Marcadores distintos entre apariciones: "+e.xs.join(" / ")}
      if(e.bad.length){r.est="rv";r.nota=(r.nota?r.nota+"; ":"")+"Otra aparici\u00f3n trae texto no reconocido: "+e.bad.join(" / ")}
    }else if(e.bad.length){r.x=e.bad[0];r.est="rv";r.nota="Texto no reconocido como marcador"}
    return r;
  });
  return {rows:rows,cols:cols,used:used,hdr:hdr,filasPT:pr.length};
}

var MK=null;
function abrirOrden(arr,nombre,hoja){
  MK={a:arr,n:nombre,h:hoja,forz:null,filt:"t",q:""};
  mkEsqueleto();mkProcesar();
  $("ov10").classList.add("on");
}
function mkProcesar(){
  var r=leerMarc(MK.a,MK.forz);
  MK.rows=r.rows;MK.cols=r.cols;MK.used=r.used;MK.filasPT=r.filasPT;
  var prog={};G.forEach(function(g){g.ped.forEach(function(p){prog[p.p]=1})});
  MK.prog=prog;MK.rows.forEach(function(x){x.prog=!!prog[x.p]});
  var sel=$("mkc");
  sel.innerHTML='<option value="">Autom\u00e1tico (recomendado)</option>'+r.cols.map(function(c){return '<option value="'+c.j+'">'+mkLetra(c.j)+' \u2014 '+c.n+' marcadores'+(c.ej?' (p. ej. '+esc(c.ej)+')':'')+'</option>'}).join("");
  sel.value=MK.forz===null?"":String(MK.forz);
  mkRefrescar();
}
function mkEsqueleto(){
  $("pn10").innerHTML='<button class="x" id="mkx">Cancelar</button><h1>Ordenar marcadores</h1><div class="sub" id="mki"></div>'+
  '<label class="tag" for="mkc">Columna de marcadores (si la detectada no es la correcta, c\u00e1mbiala; se pierden las correcciones a mano)</label><select id="mkc" class="fl"></select>'+
  '<div class="mk-ti" id="mks"></div><div class="mk-ch" id="mkf"></div>'+
  '<div class="mk-tl"><input id="mkq" type="search" class="fl" placeholder="Buscar pedido o marcador" autocomplete="off" style="max-width:380px;margin:0"><button class="up" id="mkd">Descargar Excel</button><span class="tag" id="mkcn"></span></div>'+
  '<div class="tw nrw" style="max-height:52vh;overflow:auto"><table style="min-width:900px"><thead><tr><th>#</th><th>Pedido</th><th>Marcador (puedes corregirlo)</th><th>M1</th><th>M2</th><th>M3</th><th>M4</th><th>Tipo</th><th>Estado</th><th>Programa</th></tr></thead><tbody id="mkb"></tbody></table></div>'+
  '<div id="mku"></div><div class="tag" id="mkn" style="margin-top:10px"></div><button class="gb" id="mka">Aplicar marcadores</button>';
}
function mkCont(f){return MK.rows.filter(f).length}
function mkFiltradas(){
  return MK.rows.map(function(r,i){return {r:r,i:i}}).filter(function(o){
    var r=o.r,f=MK.filt;
    if(f==="ok"&&r.est!=="ok")return false;
    if(f==="sin"&&r.est!=="sin")return false;
    if(f==="rv"&&r.est!=="rv")return false;
    if(f==="pr"&&!r.prog)return false;
    if(f==="fu"&&r.prog)return false;
    if(MK.q&&!tokOk(r.p+" "+r.x,MK.q))return false;
    return true;
  });
}
function mkRefrescar(){
  var R=MK.rows,ok=mkCont(function(r){return r.est==="ok"}),sin=mkCont(function(r){return r.est==="sin"}),rv=mkCont(function(r){return r.est==="rv"});
  var np=Object.keys(MK.prog).length,enA={};R.forEach(function(r){enA[r.p]=1});
  var falt=Object.keys(MK.prog).filter(function(p){return !enA[p]}).sort();
  $("mki").textContent=MK.n+" | hoja "+MK.h+" | "+MK.filasPT+" renglones con pedido | columna usada: "+(MK.used.length?MK.used.map(mkLetra).join(", "):"ninguna")+(MK.forz!==null?" (elegida por ti)":" (detectada por el contenido)");
  $("mks").innerHTML='<div><b>'+R.length+'</b><span>pedidos en el archivo</span></div><div class="g"><b>'+ok+'</b><span>con marcador (se aplicar\u00e1n)</span></div><div class="a"><b>'+rv+'</b><span>por revisar (no se aplican)</span></div>'+
    '<div><b>'+(np-falt.length)+' de '+np+'</b><span>pedidos del programa en el archivo</span></div><div class="g"><b>'+mkCont(function(r){return r.prog&&r.est==="ok"})+'</b><span>del programa con marcador</span></div><div><b>'+mkCont(function(r){return r.prog&&r.est==="sin"})+'</b><span>del programa sin marcador</span></div>';
  var ch=[["t","Todos ("+R.length+")"],["ok","Con marcador ("+ok+")"],["sin","Sin marcador ("+sin+")"],["rv","Por revisar ("+rv+")"],["pr","Del programa ("+mkCont(function(r){return r.prog})+")"],["fu","Fuera del programa ("+mkCont(function(r){return !r.prog})+")"]];
  $("mkf").innerHTML=ch.map(function(c){return '<button class="up'+(MK.filt===c[0]?' on':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</button>'}).join("");
  mkTabla();
  $("mku").innerHTML=falt.length?'<div class="card" style="margin-top:12px"><div class="cn" style="margin:0 0 6px">Pedidos del programa que NO aparecen en el archivo ('+falt.length+')</div><div class="mk-fu">'+falt.map(function(p){return '<span>'+esc(p)+'</span>'}).join("")+'</div><div class="tag" style="margin-top:6px">Quedar\u00e1n en N/A.</div></div>':'';
  $("mkn").textContent=rv?(rv+(rv===1?" pedido por revisar no se aplica":" pedidos por revisar no se aplican")+" y queda(n) en N/A. Corr\u00edgelos en la tabla para incluirlos."):"";
  $("mka").textContent="Aplicar "+ok+(ok===1?" marcador":" marcadores");$("mka").disabled=ok===0;
}
function mkTabla(){
  var a=mkFiltradas();
  $("mkcn").textContent=a.length+" de "+MK.rows.length;
  $("mkb").innerHTML=a.length?a.map(function(o){
    var r=o.r,e=r.est==="ok"?'<span class="mkc mk-ok">Con marcador</span>':r.est==="sin"?'<span class="mkc mk-sin">Sin marcador</span>':'<span class="mkc mk-rv">Revisar</span>';
    if(r.edit)e+='<span class="mkc mk-ed">Editado</span>';
    if(r.nota)e+='<span class="mk-nota">'+esc(r.nota)+'</span>';
    return '<tr'+(r.est==="rv"?' class="mk-rvr"':'')+'><td>'+(o.i+1)+'</td><td><b>'+esc(r.p)+'</b>'+(r.veces>1?'<span class="mk-nota" style="color:var(--mu)">'+r.veces+' apariciones</span>':'')+'</td><td><input class="fl mk-in" data-i="'+o.i+'" value="'+ea(r.x)+'" placeholder="(sin marcador)"></td>'+
      r.m.map(function(m){return '<td>'+esc(m)+'</td>'}).join("")+'<td>'+esc(r.t)+'</td><td>'+e+'</td><td>'+(r.prog?'S\u00ed':'No')+'</td></tr>';
  }).join(""):'<tr><td colspan="10" style="text-align:center;color:var(--mu);padding:18px">No hay pedidos con este filtro.</td></tr>';
}
function mkAplicar(){
  var mapa={};
  MK.rows.forEach(function(r){if(r.est==="ok"){var q=parseMarc(mkNorm(r.x));mapa[r.p]={x:mkNorm(r.x),p:{m:q.m,t:q.t,x:mkNorm(r.x),flag:""}}}});
  if(!Object.keys(mapa).length){toast("No hay marcadores para aplicar.");return}
  $("ov10").classList.remove("on");
  aplicarMarc({mapa:mapa});
  MK=null;
}
function mkDescargar(){
  var a=mkFiltradas();if(!a.length){alert("No hay filas para descargar con este filtro.");return}
  var num=function(m){var n=Number(m);return m!=="N/A"&&isFinite(n)?n:"N/A"},est={ok:"Con marcador",sin:"Sin marcador",rv:"Revisar"};
  var rows=[["Pedido","Marcador","M1","M2","M3","M4","Tipo de marcador","Estado","En el programa"]].concat(a.map(function(o){var r=o.r;return [r.p,r.x,num(r.m[0]),num(r.m[1]),num(r.m[2]),num(r.m[3]),r.t,est[r.est]+(r.edit?" (editado)":""),r.prog?"S\u00ed":"No"]}));
  var d=new Date(),nm="Marcadores_ordenados_"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
  if(window.XLSX){var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Marcadores");XLSX.writeFile(wb,nm+".xlsx");return}
  var csv="\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  var l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));l.download=nm+".csv";document.body.appendChild(l);l.click();l.remove();
}
$("pn10").addEventListener("click",function(e){
  var t=e.target,i=t.id;
  if(i==="mkx"){$("ov10").classList.remove("on");MK=null;return}
  if(i==="mka"){mkAplicar();return}
  if(i==="mkd"){mkDescargar();return}
  if(t.dataset&&t.dataset.f&&MK){MK.filt=t.dataset.f;mkRefrescar()}
});
$("pn10").addEventListener("input",function(e){if(e.target.id==="mkq"&&MK){MK.q=e.target.value.trim();mkTabla()}});
$("pn10").addEventListener("change",function(e){
  var t=e.target;if(!MK)return;
  if(t.id==="mkc"){MK.forz=t.value===""?null:+t.value;mkProcesar();return}
  if(t.classList.contains("mk-in")){var r=MK.rows[+t.dataset.i];r.x=t.value;r.edit=true;mkRellenar(r);mkRefrescar()}
});
function aplicarMarc(mp){
  var filas=[];
  Object.keys(mp.mapa).forEach(function(p){var q=mp.mapa[p].p;if(q)filas.push({p:p,m:q.m,t:q.t,x:q.x})});
  if(!filas.length){toast("El archivo no trae marcadores.");return}
  if(SH()){
    api("marcadores",{filas:filas}).then(function(r){
      if(!r.ok)throw new Error(r.error||"Error");
      applyState(r);toast("Marcadores guardados: "+filas.length+" pedidos. Filas actualizadas hoy: "+(r.actualizadas||0)+".");
    }).catch(function(e){toast("No se guardaron los marcadores: "+(e&&e.message?e.message:"sin conexi\u00f3n")+".")});
    return;
  }
  var nm={},n=0,hoyI=isoDe(hoyStr());
  filas.forEach(function(f){nm[f.p]={m:f.m,t:f.t,x:f.x}});
  MARC=nm;try{localStorage.setItem("ectMarc",JSON.stringify(MARC))}catch(e){}
  function pon(v){var q=nm[v[4]];if(!q)return;v[10]=q.m[0];v[11]=q.m[1];v[12]=q.m[2];v[13]=q.m[3];v[14]=q.t;n++}
  TBL.forEach(function(r){pon(r.v)});HIST.forEach(function(h){if(h.iso===hoyI)pon(h.v)});
  saveT();try{localStorage.setItem("ectHist",JSON.stringify(HIST))}catch(e){}
  toast("Marcadores guardados: "+filas.length+" pedidos. Filas actualizadas hoy: "+n+".");
}
$("fm").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  if(!G.length){toast("Primero carga el programa del d\u00eda.");e.target.value="";return}
  if(!window.XLSX){alert("Se necesita internet para leer el archivo Excel.");e.target.value="";return}
  var rd=new FileReader();
  rd.onload=function(ev){try{
    var wb=XLSX.read(ev.target.result,{type:"array"}),best=null;
    wb.SheetNames.forEach(function(n){var a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}),c=0;a.forEach(function(r){if(r&&mkPed(r))c++});if(!best||c>best.c)best={a:a,c:c,n:n}});
    if(!best||!best.c){alert("No encontr\u00e9 pedidos (PT-xxxxx xx) en el archivo. Revisa que sea el Excel convertido del PDF.");return}
    abrirOrden(best.a,f.name,best.n);
  }catch(err){alert("No se pudo leer el archivo")}};
  rd.readAsArrayBuffer(f);e.target.value="";
});
function conf(id,label,fn){
  var b=document.getElementById(id);
  b.addEventListener("click",function(){
    if(b.dataset.arm){delete b.dataset.arm;b.textContent=label;fn();return}
    b.dataset.arm="1";b.textContent="¿Seguro? Toca otra vez";
    setTimeout(function(){if(b.dataset.arm){delete b.dataset.arm;b.textContent=label}},4000);
  });
}
conf("um","Desmarcar enviados",function(){if(SH()){api("desmarcarTodo").then(function(){VER="";refresh()}).catch(function(){});return}SENT={};save();render()});
conf("bt","Cerrar y limpiar",function(){if(TBL.length)dlTable();if(SH()){api("borrarTodo").then(function(){VER="";refresh()}).catch(function(){});return}SENT={};save();TBL=[];saveT();saveRows([]);MARC={};try{localStorage.removeItem("ectMarc")}catch(e){}CAMBIO=null;try{localStorage.removeItem("ectCambio")}catch(e){}build([]);updBn()});
build(loadRows());updBn();setTimeout(chkPend,800);
</script></body></html>
