async function send(){
  var t=msg(G[CUR],SEL,document.getElementById("rs").value.trim());
  if(!PHOTO){hint("Primero toma la foto.");return}
  if(!document.getElementById("rs").value.trim()){hint("Captura el resultado de la prueba.");return}
  if(!CFG.turno||!CFG.insp||!CFG.sup){hint("Captura Turno, Inspector y Supervisor en Datos.");return}
  try{
    if(navigator.canShare&&navigator.canShare({files:[PHOTO]})){
      await navigator.share({files:[PHOTO],text:t});mark(true);return;
    }
  }catch(err){if(err&&err.name==="AbortError")return}
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
  hint("Adjunta la foto en el chat de WhatsApp.");
  mark(true);
}

function parse(rows){
  var map={},order=[],last=null;
  rows.forEach(function(r){
    if(r[0]!==null&&r[0]!==undefined&&r[0]!==""){
      var c=String(r[0]),k=c.split(".")[0];
      if(!map[k]){map[k]={k:k,grado:r[1],flauta:r[2],ancho:r[3],metros:0,ped:[]};order.push(k)}
      last={g:map[k],c:c,m:Number(r[4])||0};map[k].metros+=last.m;
    }
    if(r[5]&&last)last.g.ped.push({p:r[5],cl:r[6],an:r[7],lg:r[8],m:last.m,c:last.c});
  });
  return order.map(function(k){return map[k]});
}
function sg(x){return x.ped.map(function(p){return p.p+"|"+p.c}).sort().join(",")}
function diff(a,b){
  var om={},nm={},mov=[],nu=[],fa=[],di=[];
  a.forEach(function(x,i){om[x.k]={i:i,x:x}});b.forEach(function(x){nm[x.k]=1});
  b.forEach(function(x,i){
    var o=om[x.k];if(!o){nu.push(x.k);return}
    if(o.i!==i)mov.push({k:x.k,de:o.i+1,a:i+1,grado:x.grado});
    if(sg(x)!==sg(o.x))di.push({k:x.k,m:"pedidos distintos"});
    else if(Math.round(x.metros)!==Math.round(o.x.metros))di.push({k:x.k,m:"metros distintos"});
  });
  a.forEach(function(x){if(!nm[x.k])fa.push(x.k)});
  return {mov:mov,nuevos:nu,faltan:fa,dist:di};
}
function showCambio(d,rev){

    if(d.nuevos.length)h+='<div>Grupos nuevos: '+esc(d.nuevos.join(", "))+'</div>';
    if(d.faltan.length)h+='<div>Grupos que ya no vienen: '+esc(d.faltan.join(", "))+'</div>';
    d.dist.forEach(function(x){h+='<div>Grupo '+esc(x.k)+': '+esc(x.m)+'</div>'});
    h+='</div>';
  }
  h+=d.mov.map(function(m){return '<div class="card po" style="cursor:default"><div class="row" style="border:0;padding:0;align-items:center"><div><div class="pn" style="font-size:20px">Grupo '+esc(m.k)+'</div><div class="tag">'+esc(m.grado||"")+'</div></div><div class="pn" style="font-size:20px">'+m.de+' \u2192 '+m.a+'</div></div></div>'}).join("");
  if(rev)h+='<button class="gb" id="ap">Aplicar cambios</button>';
  $("pn6").innerHTML=h;$("ov6").classList.add("on");

function clean(rows){return rows.filter(function(r){return r.some(function(c){return c!=null&&c!==""})})}
function subir(rows){
  rows=clean(rows);
  if(!G.length){aplicar(rows,null);return}
  var d=diff(G,parse(rows));PEND={rows:rows,d:d};showCambio(d,true);
}
function aplicar(rows,d){
  var cam=null;
  if(d&&(d.mov.length||d.nuevos.length||d.faltan.length||d.dist.length))cam={movidos:d.mov,nuevos:d.nuevos,faltan:d.faltan,dist:d.dist};
  if(SH()){
    api("programa",{rows:rows,cambio:cam}).then(function(r){if(r.ok)applyState(r);else alert(r.error||"Error")}).catch(function(){alert("Sin conexi\u00f3n con el servidor.")});
    return;
  }
  if(cam){cam.ts=Date.now();cam.id=String(cam.ts);cam.por=SES?SES.nombre:"";CAMBIO=cam;try{localStorage.setItem("ectCambio",JSON.stringify(cam))}catch(e){}}
  saveRows(rows);build(rows);updBn();
}

  var b=$("bn"),dis="";try{dis=localStorage.getItem("ectCamDis")||""}catch(e){}
  if(!CAMBIO||String(CAMBIO.id)===dis){b.hidden=true;return}
  var hr=new Date(CAMBIO.ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),n=(CAMBIO.movidos||[]).length;

  b.hidden=false;
}

function toast(t){
  var e=$("ts");
  if(!e){e=document.createElement("div");e.id="ts";document.body.appendChild(e)}
  e.textContent=t;e.className="on";
  clearTimeout(window._tt);window._tt=setTimeout(function(){e.className=""},8000);
}
function med(p){
  var l=p.lg,a=p.an;
  if(l==null||l===""||a==null||a==="")return "Medidas no disponibles";
  return "Largo "+(isNaN(Number(l))?l:fm(l))+" mm \u00d7 Ancho "+(isNaN(Number(a))?a:fm(a))+" mm";
}
function conf(id,label,fn){
  var b=document.getElementById(id);

    if(b.dataset.arm){delete b.dataset.arm;b.textContent=label;fn();return}
    b.dataset.arm="1";b.textContent="¿Seguro? Toca otra vez";
    setTimeout(function(){if(b.dataset.arm){delete b.dataset.arm;b.textContent=label}},4000);
  });
}
